Acceleration:
    type: LogicType
    value: 216
    desc:
        zh: 加速度值, 着陆时减速的火箭将显示为负值
        en: Acceleration value. Decelerating rockets during landing will show negative values

Activate:
    type: LogicType
    value: 9
    desc:
        zh: 如果设备已激活(通常表示正在运行), 则为1, 否则为0
        en: 1 if the device is activated (usually running), 0 otherwise

AirRelease:
    type: LogicType
    value: 75
    desc:
        zh: 空气释放系统的当前状态, 例如AirRelease=1表示太空服的空气系统设置为On(启用)
        en: Current state of the air release system, e.g. AirRelease=1 means the spacesuit air system is set to On

AlignmentError:
    type: LogicType
    value: 243
    desc:
        zh: 望远镜当前指向方位与目标之间的角度偏差值, 表示望远镜的"偏离目标"程度, 无目标时返回NaN
        en: Angular deviation between the telescope's current pointing direction and the target. Returns NaN when there is no target

Altitude:
    type: LogicType
    value: 269
    desc:
        zh: 火箭距离行星表面的高度. -1表示火箭位于太空
        en: Height of the rocket above the planet surface. -1 means the rocket is in space

Apex:
    type: LogicType
    value: 238
    desc:
        zh: 火箭在再次上升前将达到的最低高度
        en: The lowest altitude the rocket will reach before ascending again

AutoLand:
    type: LogicType
    value: 226
    desc:
        zh: 启动自动着陆算法. 火箭将自动调节节流阀, 自动启动和关闭引擎, 以实现平稳着陆
        en: Activates the auto-landing algorithm. The rocket will automatically adjust throttle and start/stop engines for a smooth landing

AutoShutOff:
    type: LogicType
    value: 218
    desc:
        zh: 是否在到达目的地时自动关闭火箭上的所有设备
        en: Whether to automatically shut down all devices on the rocket when reaching the destination

BestContactFilter:
    type: LogicType
    value: 267
    desc:
        zh: 将卫星的自动目标选择过滤为单一参考ID
        en: Filters the satellite's automatic target selection to a single reference ID

Bpm:
    type: LogicType
    value: 103
    desc:
        zh: 节拍
        en: Beats per minute

BurnTimeRemaining:
    type: LogicType
    value: 225
    desc:
        zh: 火箭燃料耗尽的预计时间, 单位为秒. 基于当前燃料消耗速度计算
        en: Estimated time until rocket fuel is exhausted, in seconds. Calculated based on current fuel consumption rate

CelestialHash:
    type: LogicType
    value: 242
    desc:
        zh: 当前目标天体的哈希值
        en: Hash value of the current target celestial body

CelestialParentHash:
    type: LogicType
    value: 250
    desc:
        zh: 天体所绕行的母天体的名称的哈希值, 若无母天体则为0
        en: Hash value of the parent body name the celestial body orbits. 0 if there is no parent body

Channel0:
    type: LogicType
    value: 165
    desc:
        zh: 频道在电缆网络上是易失性的
        en: The channel is volatile on the cable network

Channel1:
    type: LogicType
    value: 166
    desc:
        zh: 频道在电缆网络上是易失性的
        en: The channel is volatile on the cable network

Channel2:
    type: LogicType
    value: 167
    desc:
        zh: 频道在电缆网络上是易失性的
        en: The channel is volatile on the cable network

Channel3:
    type: LogicType
    value: 168
    desc:
        zh: 频道在电缆网络上是易失性的
        en: The channel is volatile on the cable network

Channel4:
    type: LogicType
    value: 169
    desc:
        zh: 频道在电缆网络上是易失性的
        en: The channel is volatile on the cable network

Channel5:
    type: LogicType
    value: 170
    desc:
        zh: 频道在电缆网络上是易失性的
        en: The channel is volatile on the cable network

Channel6:
    type: LogicType
    value: 171
    desc:
        zh: 频道在电缆网络上是易失性的
        en: The channel is volatile on the cable network

Channel7:
    type: LogicType
    value: 172
    desc:
        zh: 频道在电缆网络上是易失性的
        en: The channel is volatile on the cable network

Charge:
    type: LogicType
    value: 11
    desc:
        zh: 设备当前的电量
        en: Current charge of the device

Chart:
    type: LogicType
    value: 256
    desc:
        zh: 火箭对太空地图地点进行测绘时的状态, 返回一个范围内的量化值. 若未处于测绘状态, 返回-1
        en: State of the rocket mapping a space map location, returns a quantified value. Returns -1 if not in mapping state

ChartedNavPoints:
    type: LogicType
    value: 259
    desc:
        zh: 火箭当前目标太空地图地点已测绘的导航点数量
        en: Number of mapped navigation points at the rocket's current target space map location

ClearMemory:
    type: LogicType
    value: 62
    desc:
        zh: 设置为1时, 将重置设备计数器内存(比如ExportCount). 此值自身将在重置完成后返回0
        en: When set to 1, resets device counter memory (e.g. ExportCount). Returns 0 after reset completes

CollectableGoods:
    type: LogicType
    value: 101
    desc:
        zh: 获取火箭返回玩家所在地的燃料花费
        en: Gets the fuel cost for the rocket to return to the player's location

Color:
    type: LogicType
    value: 38
    desc:
        zh: 设备的颜色设置，以整型表示。0:蓝色 1:灰色 2:绿色 3:橙色 4:红色 5:黄色 6:白色 7:黑色 8:棕色 9:土黄色 10:粉红色 11:紫色；大于11为紫色，小于0为蓝色
        en: Device color as integer. 0:Blue 1:Gray 2:Green 3:Orange 4:Red 5:Yellow 6:White 7:Black 8:Brown 9:Tan 10:Pink 11:Purple; values >11 are purple, values <0 are blue

Combustion:
    type: LogicType
    value: 98
    desc:
        zh: 检测空气环境是否正在燃烧. 是则返回1, 否则返回0
        en: Detects if the air environment is burning. Returns 1 if true, 0 if false

CombustionInput:
    type: LogicType
    value: 146
    desc:
        zh: 检测设备输入口的管道网是否正在燃烧. 是则返回1, 否则返回0
        en: Detects if the pipe network at the device input is burning. Returns 1 if true, 0 if false

CombustionInput2:
    type: LogicType
    value: 147
    desc:
        zh: 检测设备输入口2的管道网是否正在燃烧. 是则返回1, 否则返回0
        en: Detects if the pipe network at device input 2 is burning. Returns 1 if true, 0 if false

CombustionLimiter:
    type: LogicType
    value: 153
    desc:
        zh: 延缓机器的内部燃烧速度(范围:0~100), 0代表燃烧速度最慢, 100代表燃烧速度最快
        en: "Limits machine internal combustion speed (range: 0~100). 0 = slowest, 100 = fastest"

CombustionOutput:
    type: LogicType
    value: 148
    desc:
        zh: 检测设备输出口的管道网是否正在燃烧. 是则返回1, 否则返回0
        en: Detects if the pipe network at the device output is burning. Returns 1 if true, 0 if false

CombustionOutput2:
    type: LogicType
    value: 149
    desc:
        zh: 检测设备输出口2的管道网是否正在燃烧. 是则返回1, 否则返回0
        en: Detects if the pipe network at device output 2 is burning. Returns 1 if true, 0 if false

CompletionRatio:
    type: LogicType
    value: 61
    desc:
        zh: 设备当前的制造进度, 取值介于0和1
        en: Current manufacturing progress of the device, value between 0 and 1

ContactSlotIndex:
    type: LogicType
    value: 282
    desc:
        zh: "贸易商生成槽位的索引值. 该索引定义了贸易商的类别, 例如: 实用型, 小型, 中型等."
        en: Index of the trader's generation slot. Defines trader category (utility, small, medium, etc.)

ContactTypeId:
    type: LogicType
    value: 198
    desc:
        zh: 联络信号的类型ID
        en: Type ID of the contact signal

CurrentCode:
    type: LogicType
    value: 261
    desc:
        zh: 火箭当前太空地图地点的地址码
        en: Address code of the rocket's current space map location

CurrentNodeType:
    type: LogicType
    value: 352
    desc:
        zh: 返回火箭当前位置的节点类型整数
        en: Returns the NodeType as an integer for the current location for a Rocket

CurrentResearchPodType:
    type: LogicType
    value: 93

Density:
    type: LogicType
    value: 262
    desc:
        zh: 火箭目标太空地图地点可开采矿床的密度
        en: Density of mineable deposits at the rocket's target space map location

DerivativeGain:
    type: LogicType
    value: 276
    desc:
        zh: PID控制器的微分增益. 此值决定了控制器对误差变化率的响应程度. 较高的值有助于抑制振荡并提高稳定性, 但也可能导致噪声放大.
        en: Derivative gain of the PID controller. Determines how the controller responds to the rate of error change. Higher values help suppress oscillation and improve stability, but may also amplify noise.

DestinationCode:
    type: LogicType
    value: 215
    desc:
        zh: 火箭目标太空地图地点的地址码
        en: Address code of the rocket's target space map location

Discover:
    type: LogicType
    value: 255
    desc:
        zh: 火箭对太空地图地点进行扫描时的状态, 返回一个范围内的量化值. 若未处于扫描状态, 返回-1
        en: Scanning state of the rocket for a space map location, returns a quantified value. Returns -1 if not in scanning state

Dispense:
    type: LogicType
    value: 356
    desc:
        zh: 设备将分发一次，用于导出设备的逻辑模式
        en: The device will dispense once, used in logic mode for export devices.

DispenseSlot:
    type: LogicType
    value: 357
    desc:
        zh: 设置为已存储物品的索引以单次分发该特定物品。设备分发后会将此值重置为-1。值为-1表示空闲。
        en: Set to the index of a stored item to dispense that specific item once. The device dispenses it then resets this back to -1. A value of -1 means idle.

DistanceAu:
    type: LogicType
    value: 244
    desc:
        zh: 当前与天体的距离（以天文单位计）
        en: Current distance to the celestial body, in astronomical units

DistanceKm:
    type: LogicType
    value: 249
    desc:
        zh: 当前与天体的距离（以千米计）
        en: Current distance to the celestial body, in kilometers

DrillCondition:
    type: LogicType
    value: 240
    desc:
        zh: 当前设备钻头槽位中钻头的状况（以0到1表示）
        en: Condition of the drill bit in the device's drill slot, expressed as 0 to 1

DryMass:
    type: LogicType
    value: 220
    desc:
        zh: 火箭不包括燃料在内的干质量, 以千克为单位. 火箭质量越大, 移动到太空中的新地点所消耗的燃料越多
        en: Dry mass of the rocket excluding fuel, in kilograms. Heavier rockets consume more fuel to travel to new locations in space.

Eccentricity:
    type: LogicType
    value: 247
    desc:
        zh: 轨道椭圆度（偏心率）的度量值. 范围从0（完美圆形）到1（抛物线轨迹）
        en: Measure of orbital eccentricity. Ranges from 0 (perfect circle) to 1 (parabolic trajectory)

ElevatorLevel:
    type: LogicType
    value: 40
    desc:
        zh: 电梯当前的楼层
        en: Current floor of the elevator

ElevatorSpeed:
    type: LogicType
    value: 39
    desc:
        zh: 电梯的速度
        en: Speed of the elevator

EnergyConvected:
    type: LogicType
    value: 354
    desc:
        zh: 上一次大气刷新时与环境对流交换的能量，单位为焦耳。正值表示从内部大气带走热量（冷却）；负值表示增加热量。
        en: The energy convected with the surroundings on the last atmospheric tick, in Joules. Positive values remove heat from the internal atmosphere (cooling); negative values add heat.

EnergyRadiated:
    type: LogicType
    value: 355
    desc:
        zh: 上一次大气刷新时向环境辐射的能量，单位为焦耳，已扣除太阳加热净值。正值表示从内部大气带走热量（冷却）；负值表示增加热量。
        en: The energy radiated to the surroundings on the last atmospheric tick, in Joules, net of solar heating. Positive values remove heat from the internal atmosphere (cooling); negative values add heat.

EntityState:
    type: LogicType
    value: 239
    desc:
        zh: 当前实体状态（如死亡/无意识/存活等），以整数表示
        en: Current entity state (e.g. dead/unconscious/alive), expressed as an integer

EnvironmentEfficiency:
    type: LogicType
    value: 104
    desc:
        zh: 设备反馈的环境对于工作效率的影响, 是取值范围介于0和1的浮点数
        en: Environmental impact on work efficiency reported by the device, a float between 0 and 1

Error:
    type: LogicType
    value: 4
    desc:
        zh: 如果设备处于错误状态, 则为1, 否则为0
        en: 1 if the device is in an error state, 0 otherwise

ExhaustVelocity:
    type: LogicType
    value: 235
    desc:
        zh: 排出气体的速度, 单位为m/s
        en: Velocity of exhaust gas, in m/s

ExportCount:
    type: LogicType
    value: 63
    desc:
        zh: 自设备上次进行ClearMemory操作时至今输出的物品总数
        en: Total number of items exported since the last ClearMemory operation on the device

Extended:
    type: LogicType
    value: 272
    desc:
        zh: 已展开
        en: Extended

Filtration:
    type: LogicType
    value: 74
    desc:
        zh: 过滤系统的当前状态, 例如Filtration=1表示太空服的过滤设置为On(启用)
        en: Current state of the filtration system, e.g. Filtration=1 means spacesuit filtration is set to On

FlightControlRule:
    type: LogicType
    value: 236
    desc:
        zh: 火箭飞行控制规则. None=0:无自动驾驶. Normal=1, 接近目标60米内. Alternate=2, 速度太快, 推力全开. Alternate2=3, 速度太慢, 加速到合适速度. FinalApproach=4, 正受控减速直至火箭降落平台
        en: "Rocket flight control rule. None=0: no autopilot. Normal=1: within 60m of target. Alternate=2: too fast, full thrust. Alternate2=3: too slow, accelerate to proper speed. FinalApproach=4: controlled deceleration to landing pad"

Flush:
    type: LogicType
    value: 174
    desc:
        zh: 将该值设置为1可以激活设备自带的排空功能
        en: Setting this value to 1 activates the device's built-in purge function

ForceWrite:
    type: LogicType
    value: 85
    desc:
        zh: 强制逻辑写入设备重新写入
        en: Forces logic write to refresh the device write

ForwardX:
    type: LogicType
    value: 227
    desc:
        zh: 实体朝向的规范化矢量表示
        en: Normalized vector representation of the entity's forward X direction

ForwardY:
    type: LogicType
    value: 228
    desc:
        zh: 实体朝向的规范化矢量表示
        en: Normalized vector representation of the entity's forward Y direction

ForwardZ:
    type: LogicType
    value: 229
    desc:
        zh: 实体朝向的规范化矢量表示
        en: Normalized vector representation of the entity's forward Z direction

Fuel:
    type: LogicType
    value: 99
    desc:
        zh: 获取火箭返回玩家所在地的燃料花费
        en: Gets the fuel cost for the rocket to return to the player's location

Gravity:
    type: LogicType
    value: 358
    desc:
        zh: 作用在火箭上的重力加速度，单位为m/s²
        en: The gravitational acceleration acting on the rocket, in m/s²

Harvest:
    type: LogicType
    value: 69
    desc:
        zh: 对所有基于植物工作的设备执行收获操作
        en: Executes harvest operation on all plant-based devices

HealthDamage:
    type: LogicType
    value: 350
    desc:
        zh: 实体受到的总生命值伤害量
        en: The total amount of health damage on the entity

Horizontal:
    type: LogicType
    value: 20
    desc:
        zh: 设备的水平角度设置
        en: Horizontal angle setting of the device

HorizontalRatio:
    type: LogicType
    value: 34
    desc:
        zh: 设备的水平角度百分比设置
        en: Horizontal angle percentage setting of the device

Idle:
    type: LogicType
    value: 37
    desc:
        zh: 如果设备当前处于闲置状态, 则为1, 否则为0
        en: 1 if the device is currently idle, 0 otherwise

ImportCount:
    type: LogicType
    value: 64
    desc:
        zh: 自设备上次进行ClearMemory操作时至今输入的物品总数
        en: Total number of items imported since the last ClearMemory operation on the device

Inclination:
    type: LogicType
    value: 246
    desc:
        zh: 轨道平面相对于赤道平面的倾斜角度（以度为单位）. 定义轨道平面的角度
        en: Inclination angle of the orbital plane relative to the equatorial plane, in degrees. Defines the angle of the orbital plane

Index:
    type: LogicType
    value: 241
    desc:
        zh: 设备的当前索引值
        en: Current index value of the device

IntegralGain:
    type: LogicType
    value: 275
    desc:
        zh: PID控制器的积分增益. 此值决定了控制器对随时间累积误差的响应程度. 较高的值有助于消除稳态误差, 但也可能导致振荡或不稳定.
        en: Integral gain of the PID controller. Determines how the controller responds to accumulated error over time. Higher values help eliminate steady-state error, but may cause oscillation or instability.

InterrogationProgress:
    type: LogicType
    value: 157
    desc:
        zh: 该卫星天线对其当前目标的信号通信进度, 以0~1的比率表示
        en: Signal communication progress of the satellite antenna to its current target, expressed as a ratio from 0 to 1

LineNumber:
    type: LogicType
    value: 173
    desc:
        zh: 在此设备上运行的IC芯片代码当前执行的行号. 虽然该值支持写入, 但请谨慎使用
        en: Current line number being executed by the IC chip code running on this device. This value supports writing, but use with caution.

Lock:
    type: LogicType
    value: 10
    desc:
        zh: 设备如果锁定则为1, 否则为0. 可在大多数设备中设置, 锁定时设备依然可以运转, 但无法人工操作
        en: 1 if the device is locked, 0 otherwise. Can be set on most devices. Locked devices still operate but cannot be manually controlled.

ManualResearchRequiredPod:
    type: LogicType
    value: 94
    desc:
        zh: 设置pod类型, 以便在分解pod时搜索一个特定的pod
        en: Sets the pod type to search for a specific pod when decomposing pods

Mass:
    type: LogicType
    value: 219
    desc:
        zh: 火箭包括燃料和货物在内的总质量, 以千克为单位. 火箭质量越大, 移动到太空中的新地点所消耗的燃料越多
        en: Total mass of the rocket including fuel and cargo, in kilograms. Heavier rockets consume more fuel to travel to new locations in space.

Maximum:
    type: LogicType
    value: 23
    desc:
        zh: 设备的最大Setting(设置)值
        en: Maximum Setting value of the device

MineablesInQueue:
    type: LogicType
    value: 96
    desc:
        zh: 返回AIMEe队列中等待开采的矿物含量
        en: Returns the amount of minerals waiting to be mined in the AIMEe queue

MineablesInVicinity:
    type: LogicType
    value: 95
    desc:
        zh: 返回AIMEe周围扩展区域内的潜在可开采矿物含量
        en: Returns the amount of potential mineable minerals in the extended area around AIMEe

MinedQuantity:
    type: LogicType
    value: 266
    desc:
        zh: 火箭目标太空地图地点已开采资源总量
        en: Total amount of mined resources at the rocket's target space map location

Minimum:
    type: LogicType
    value: 277
    desc:
        zh: 所提供逻辑设备的最小值。
        en: The minimum value of the provided logic device.

MinimumWattsToContact:
    type: LogicType
    value: 163
    desc:
        zh: 卫星天线检测到星际贸易飞船所需的最小功率, 只有超过该功率的天线才能与星际贸易飞船进行通信
        en: Minimum power required for a satellite antenna to detect an interstellar trade ship. Only antennas exceeding this power can communicate with it.

Mode:
    type: LogicType
    value: 3
    desc:
        zh: 以整数形式表示的设备Mode(模式)状态, 不同设备的Mode值对设备工作造成的影响也不尽相同
        en: Device Mode state expressed as an integer. The effect of Mode values varies across different devices.

NameHash:
    type: LogicType
    value: 268
    desc:
        zh: 用一个32位长度的整型值作为哈希值来区分对象
        en: A 32-bit integer hash value used to distinguish objects

NavPoints:
    type: LogicType
    value: 258
    desc:
        zh: 火箭当前目标太空地图地点的导航点数量
        en: Number of navigation points at the rocket's current target space map location

NetworkFault:
    type: LogicType
    value: 273
    desc:
        zh: 连接的网络出现故障, 例如管道破裂或其他故障.
        en: A fault exists in the connected network, such as a pipe rupture or other failure.

NextWeatherEventTime:
    type: LogicType
    value: 97
    desc:
        zh: 返回下一个天气事件倒计时, 单位为秒
        en: Returns the countdown to the next weather event, in seconds

NextWeatherHash:
    type: LogicType
    value: 281
    desc:
        zh: 以一个32位整数形式提供下一个天气事件名称的哈希值.
        en: Provides the hash value of the next weather event name as a 32-bit integer.

On:
    type: LogicType
    value: 28
    desc:
        zh: 设备的启动状态, 0为关闭, 1为开启
        en: Power state of the device. 0 for off, 1 for on.

Open:
    type: LogicType
    value: 2
    desc:
        zh: 如果设备已启动, 则为1, 否则为0
        en: 1 if the device is activated, 0 otherwise

OperationalTemperatureEfficiency:
    type: LogicType
    value: 150
    desc:
