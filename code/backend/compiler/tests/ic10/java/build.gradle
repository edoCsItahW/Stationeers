plugins {
    id 'java'
}

group = 'com.stationeers'
version = '1.0.0'

repositories {
    maven { url 'https://maven.aliyun.com/repository/public' }
    maven { url 'https://maven.aliyun.com/repository/google' }
    mavenCentral()
}

dependencies {
    // 通过 composite build 引入最终用户的 ic10 java 包（tests/java/ic10）
    implementation 'com.stationeers:ic10:1.0.0'

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()

    // 动态库查找路径：使用 tests/java/ic10/libs（最终用户目录中的 dll）
    def libsDir = file("../../java/ic10/libs").absolutePath
    systemProperty "java.library.path", libsDir
    // Windows 下 dll 依赖也通过 PATH 查找
    environment "PATH", libsDir + ";" + (System.getenv("PATH") ?: "")

    // 标准库文件（最终用户目录中的 resources）
    systemProperty "stdLib.path",
        file("../../java/ic10/src/main/resources/stdLib.ic").absolutePath

    // grammarTest.ic fixture 文件（用于 SystemTest 端到端测试）
    systemProperty "grammarTest.path",
        file("../../grammarTest.ic").absolutePath
}
