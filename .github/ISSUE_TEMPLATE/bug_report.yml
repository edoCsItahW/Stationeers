name: Bug Report
description: Report a bug in the IC10 compiler
labels: ["bug"]
assignees: []
body:
  - type: dropdown
    id: module
    attributes:
      label: Module
      description: Which module is affected by this bug?
      options:
        - Lexer (tokenization, token types, number parsing)
        - Parser (syntax parsing, AST construction)
        - Semantic (type checking, symbol resolution)
        - Linker (multi-unit symbol merging)
        - Incremental (inclexer, incparser, incremental compilation)
        - Node.js Bindings (ic10c-node)
        - Python Bindings (ic10c-python)
        - CLI (ic10c command line tool)
        - CI/CD (build workflows, GitHub Actions)
        - Documentation
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Which version of the compiler are you using? (e.g., v2.0.0, commit hash)
      placeholder: v2.0.0
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Platform
      description: Operating system and compiler environment (e.g., Windows 10, Linux Ubuntu 22.04, Node.js 26)
      placeholder: Windows 10 / MSVC 2022 / Node.js 26
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Create a file with the following IC10 code:
           ```ic10
           alias counter r0
           start:
               move r0 10
               hcf
           ```
        2. Run: ic10c --emit-tokens input.ic
        3. See error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened. Include error messages, stack traces, or screenshots.
    validations:
      required: true

  - type: textarea
    id: lexer-details
    attributes:
      label: Lexer-Specific Details
      description: Required if reporting a Lexer bug. Include token stream, input source, and any unexpected tokenization.
      placeholder: |
        Input source:
        ```ic10
        $FF 0x10 %1010
        ```
        
        Expected tokens: HEX_NUMBER, DECIMAL_NUMBER, BINARY_NUMBER
        Actual tokens: ...
    validations:
      required: false

  - type: textarea
    id: parser-details
    attributes:
      label: Parser-Specific Details
      description: Required if reporting a Parser bug. Include AST output, parsing errors, or syntax-related issues.
      placeholder: |
        Input source causing parsing error:
        ```ic10
        sub r0 r1 r2  ; ternary instruction
        ```
        
        Parsing error message: ...
    validations:
      required: false

  - type: textarea
    id: semantic-details
    attributes:
      label: Semantic-Specific Details
      description: Required if reporting a Semantic bug. Include symbol table output, type inference issues, or scope errors.
      placeholder: |
        Symbol table output:
        ```json
        {...}
        ```
        
        Type mismatch error: ...
    validations:
      required: false

  - type: textarea
    id: linker-details
    attributes:
      label: Linker-Specific Details
      description: Required if reporting a Linker bug. Include multi-unit code, cross-reference issues, or visibility errors.
      placeholder: |
        File a.ic:
        ```ic10
        alias public shared r0
        ```
        
        File b.ic:
        ```ic10
        move r1 shared
        ```
        
        Linker error: ...
    validations:
      required: false

  - type: textarea
    id: incremental-details
    attributes:
      label: Incremental-Specific Details
      description: Required if reporting an Incremental bug. Include before/after source, expected caching behavior, and actual results.
      placeholder: |
        Original source:
        ```ic10
        move r0 10
        ```
        
        Modified source:
        ```ic10
        move r0 20
        ```
        
        Expected: Only line 1 should be re-lexed/re-parsed
        Actual: ...
    validations:
      required: false

  - type: textarea
    id: node-details
    attributes:
      label: Node.js Binding Details
      description: Required if reporting a Node.js binding bug. Include JavaScript/TypeScript code and error logs.
      placeholder: |
        Node.js code:
        ```typescript
        import { Lexer } from 'ic10c_node';
        const tokens = Lexer.tokenize(source);
        ```
        
        Error: ...
    validations:
      required: false

  - type: textarea
    id: python-details
    attributes:
      label: Python Binding Details
      description: Required if reporting a Python binding bug. Include Python code and error tracebacks.
      placeholder: |
        Python code:
        ```python
        import ic10_python as ic10
        tokens = ic10.Lexer.tokenize(source)
        ```
        
        Traceback:
        ```
        ...
        ```
    validations:
      required: false

  - type: textarea
    id: cli-details
    attributes:
      label: CLI Details
      description: Required if reporting a CLI bug. Include command used and output.
      placeholder: |
        Command:
        ```bash
        ic10c --link a.ic b.ic --locale zh-hans
        ```
        
        Output:
        ```
        ...
        ```
    validations:
      required: false

  - type: textarea
    id: ci-details
    attributes:
      label: CI/CD Details
      description: Required if reporting a CI/CD bug. Include workflow name, run URL, and error messages.
      placeholder: |
        Workflow: ic10-node.yml
        Run URL: https://github.com/.../actions/runs/...
        Error: ...
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Information
      description: Any other context about the bug.
    validations:
      required: false