name: 编译器缺陷 | Compiler Bug
description: 报告 IC10 编译器核心、语言绑定或 CLI 的问题。Report a bug in the IC10 compiler core, its language bindings or the CLI.
title: "[Compiler Bug] "
labels: ["bug"]
assignees: []
body:
    -   type: markdown
        attributes:
            value: |
                **中文**：下面只有 4 项，但请尽量填全——**版本 + 环境 + 最小复现**比一大段描述有效得多；日志、`.ic` 片段直接贴在最后一栏即可。
                **English**: There are only four items below, but please fill them in — a **version, an environment and the smallest reproduction** are worth far more than a long description; paste logs and `.ic` snippets straight into the last box.

    -   type: dropdown
        id: module
        attributes:
            label: 模块 | Module
            description: 问题出在哪个模块？ / Which module is affected?
            options:
                - Lexer 词法分析
                - Parser 语法与 AST
                - Semantic 语义分析
                - Linker 链接
                - Incremental 增量编译
                - Bindings 语言绑定（Node.js / Python / Java）
                - CLI 命令行
                - CI/CD 构建工作流
                - Docs 文档
                - Other 其他
        validations:
            required: true

    -   type: input
        id: version
        attributes:
            label: 版本 | Version
            description: 编译器或绑定包的版本 / Compiler or binding package version
            placeholder: v3.0.0 或 commit 短哈希
        validations:
            required: true

    -   type: input
        id: environment
        attributes:
            label: 环境 | Environment
            description: 操作系统与运行时 / Operating system and runtime
            placeholder: Windows 11 · Node.js 26.7.0 ／ Ubuntu 24.04 · Python 3.12
        validations:
            required: true

    -   type: textarea
        id: details
        attributes:
            label: 问题与复现 | Problem and reproduction
            description: 最小复现、期望结果、实际结果写在一起；日志或 `.ic` 片段也贴在这一栏。 / The minimal reproduction, the expected result and the actual result in one place; logs and `.ic` snippets go in the same box.
            value: |
                ### 复现步骤 / Steps
                1.

                ### 期望 / Expected

                ### 实际 / Actual

                ### 日志或代码 / Logs or code
        validations:
            required: true
