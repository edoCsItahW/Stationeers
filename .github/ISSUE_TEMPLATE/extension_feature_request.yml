name: 扩展功能建议 | Extension Feature Request
description: 为 IC10 VS Code 扩展提一个新功能或改进建议。Suggest a new feature or enhancement for the IC10 VS Code extension.
title: "[Extension Feature] "
labels: ["enhancement", "extension"]
assignees: []
body:
    -   type: markdown
        attributes:
            value: |
                **中文**：说清"**想解决什么问题**"比"想加什么按钮"更重要；第三项可以不填。完整的现有功能清单见 [README](https://github.com/edoCsItahW/Stationeers/blob/main/code/IC10/plugins/vscode/ic10-language-support/README.md)。
                **English**: Explaining **which problem you want solved** matters more than the button you have in mind; the third item is optional. The full feature list is in the [README](https://github.com/edoCsItahW/Stationeers/blob/main/code/IC10/plugins/vscode/ic10-language-support/README.md).

    -   type: dropdown
        id: feature
        attributes:
            label: 功能领域 | Feature area
            description: 这个建议属于哪个功能？ / Which feature area would this belong to?
            options:
                - Syntax Highlighting 语法高亮
                - Semantic Highlighting 语义高亮
                - Diagnostics 实时诊断
                - Hover Tooltips 悬停提示
                - Completion 智能补全（含设备名称补全）
                - Device Name Search 按名称搜索设备类型
                - Signature Help 签名帮助
                - Code Formatting 代码格式化
                - Pseudocode Inlay Hints 伪代码内嵌提示
                - Debugger 调试器
                - "Type Annotations 类型注解（#: / #>）"
                - Editor Integration 编辑器集成（命令、快捷键、设置项）
                - Go to Definition / Find References / Rename 跳转与重命名
                - Documentation 文档
                - Other 其他
        validations:
            required: true

    -   type: textarea
        id: problem
        attributes:
            label: 问题或动机 | Problem or motivation
            description: 现在哪里别扭？想完成什么、卡在哪一步？ / What is awkward today, and what are you trying to get done?
            placeholder: 例如：写批量读写时总记不住 batchMode 有哪些取值，希望补全能直接提示……
        validations:
            required: true

    -   type: textarea
        id: solution
        attributes:
            label: 设想的方案（可选） | Proposed solution (optional)
            description: 你希望它长什么样？有替代方案也一并说明。 / What would you like it to look like? Mention alternatives too.
        validations:
            required: false
