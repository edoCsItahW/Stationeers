name: 编译器功能建议 | Compiler Feature Request
description: 为 IC10 编译器核心、语言绑定或 CLI 提一个新功能或改进建议。Suggest a new feature or enhancement for the IC10 compiler core, its language bindings or the CLI.
title: "[Compiler Feature] "
labels: ["enhancement"]
assignees: []
body:
    -   type: markdown
        attributes:
            value: |
                **中文**：说清"**想解决什么问题**"比"想加什么 API"更重要；第三项可以不填。
                **English**: Explaining **which problem you want solved** matters more than the API you have in mind; the third item is optional.

    -   type: dropdown
        id: module
        attributes:
            label: 模块 | Module
            description: 这个建议属于哪个模块？ / Which module would this belong to?
            options:
                - Lexer 词法分析
                - Parser 语法与 AST
                - Semantic 语义分析
                - Linker 链接
                - Incremental 增量编译
                - Bindings 语言绑定（Node.js / Python / Java）
                - CLI 命令行
                - CI/CD 构建工作流
                - Docs 文档
                - Other 其他
        validations:
            required: true

    -   type: textarea
        id: problem
        attributes:
            label: 问题或动机 | Problem or motivation
            description: 现在哪里别扭？想完成什么、卡在哪一步？ / What is awkward today, and what are you trying to get done?
            placeholder: 例如：想在一次编译里同时校验多个 .ic 文件，但 CLI 只接受单个输入……
        validations:
            required: true

    -   type: textarea
        id: solution
        attributes:
            label: 设想的方案（可选） | Proposed solution (optional)
            description: 你希望它长什么样？有替代方案或破坏性影响也一并说明。 / What would you like it to look like? Mention alternatives or breaking changes too.
        validations:
            required: false
