name: 扩展缺陷 | Extension Bug
description: 报告 IC10 VS Code 扩展（ic10-language-support）的问题。Report a bug in the IC10 VS Code extension (ic10-language-support).
title: "[Extension Bug] "
labels: ["bug", "extension"]
assignees: []
body:
    -   type: markdown
        attributes:
            value: |
                **中文**：只有 3 项，填全很快。提交前请先确认两件常被当成 bug 的事——**伪代码内嵌提示平时是隐藏的**，要按住 `Ctrl+Alt`（macOS 为 `Ctrl+Option`）才会显示；另外首次激活后的几秒内补全与悬停可能还没就绪。
                **English**: Only three items, quick to fill in. Before filing, please rule out two things that often look like bugs: **pseudocode inlay hints are hidden by default** and appear while `Ctrl+Alt` (`Ctrl+Option` on macOS) is held, and completion/hover may not be ready for the first few seconds after activation.

    -   type: dropdown
        id: feature
        attributes:
            label: 功能 | Feature
            description: 哪个功能出了问题？ / Which feature is affected?
            options:
                - Syntax Highlighting 语法高亮
                - Semantic Highlighting 语义高亮
                - Diagnostics 实时诊断
                - Hover Tooltips 悬停提示
                - Completion 智能补全（含设备名称补全）
                - Device Name Search 按名称搜索设备类型
                - Signature Help 签名帮助
                - Code Formatting 代码格式化
                - Pseudocode Inlay Hints 伪代码内嵌提示
                - Debugger 调试器
                - "Type Annotations 类型注解（#: / #>）"
                - Language Server 语言服务（启动、崩溃、日志）
                - Settings 设置与配置（ic10.* / .ic.yaml）
                - Documentation 文档
                - Other 其他
        validations:
            required: true

    -   type: input
        id: environment
        attributes:
            label: 环境 | Environment
            description: 扩展版本 · VS Code 版本 · 操作系统 / Extension version · VS Code version · OS
            placeholder: 扩展 2.2.0 · VS Code 1.140.0 · Windows 11
        validations:
            required: true

    -   type: textarea
        id: details
        attributes:
            label: 问题与复现 | Problem and reproduction
            description: 最小复现、期望结果、实际结果写在一起；语言服务日志见「输出」面板的 IC10 频道，相关设置也贴在这一栏。 / The minimal reproduction, expected result and actual result in one place; the language server log is in the IC10 channel of the Output panel — paste it and any relevant settings here.
            value: |
                ### 复现步骤 / Steps
                1.

                ### 期望 / Expected

                ### 实际 / Actual

                ### 语言服务日志 / Language server log
                <!-- 输出面板 → IC10 / Output panel → IC10 -->

                ### 相关设置 / Relevant settings
                <!-- 例如 ic10.language、ic10.hoverRenderer / e.g. ic10.language, ic10.hoverRenderer -->
        validations:
            required: true
