name: Setup Node Environment
description: Configure Node Environment | 配置Node环境

inputs:
    node-version:
        description: Node.js version to use. | 要使用的 Node.js 版本。
        required: false
        default: "26.7.0"

    pnpm-version:
        description: Pnpm version to use. | 要使用的 Pnpm 版本。
        required: false
        default: "11.20.0"

runs:
    using: composite

    steps:
        -   name: "[Auto] Install Node.js | 安装 Node.js"
            uses: actions/setup-node@v7
            with:
                node-version: ${{ inputs.node-version }}

        -   name: "[Auto] Install Pnpm | 安装 Pnpm"
            uses: pnpm/action-setup@v4
            with:
                version: ${{ inputs.pnpm-version }}
