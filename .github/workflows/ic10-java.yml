name: IC10 Java Bindings Build & Test
run-name: IC10 Java | IC10 Java 绑定

on:
    workflow_call:
        inputs:
            os:
                description: 'Operating system'
                type: string
                required: false
                default: 'ubuntu-latest'
            cmake-version:
                description: 'CMake version'
                type: string
                required: false
                default: '4.2.1'
            java-version:
                description: 'Java version'
                type: string
                required: false
                default: '21'
            build-type:
                description: 'Build type'
                type: string
                required: false
                default: 'Release'
            run-tests:
                description: 'Whether to run tests (C++ + Gradle)'
                type: boolean
                required: false
                default: true
            upload-artifact:
                description: 'Whether to upload build artifacts'
                type: boolean
                required: false
                default: false
            artifact-name:
                description: 'Artifact name prefix'
                type: string
                required: false
                default: 'ic10-java'
            core-artifact-name:
                description: 'Name of the IC10 core artifact to reuse (empty to build from source)'
                type: string
                required: false
                default: ''
        outputs:
            artifact-name:
                description: 'Name of the uploaded artifact'
                value: ${{ jobs.build.outputs.artifact-name }}

jobs:
    build:
        name: build ${{ inputs.os }} | 构建${{ inputs.os }}
        runs-on: ${{ inputs.os }}
        outputs:
            artifact-name: ${{ steps.artifact.outputs.name }}

        steps:
            -   name: Checkout source code | 检出源码
                uses: actions/checkout@v6

            -   name: Setup build environment | 设置构建环境
                uses: ./.github/actions/setup-build-env
                with:
                    os: ${{ inputs.os }}
                    cmake-version: ${{ inputs.cmake-version }}
                    java-version: ${{ inputs.java-version }}
                    cache-key-prefix: ic10-java

            -   name: Download core artifact | 下载核心构件
                if: inputs.core-artifact-name != ''
                uses: actions/download-artifact@v6
                with:
                    name: ${{ inputs.core-artifact-name }}
                    path: core-artifact

            -   name: Configure CMake | 配置 CMake
                shell: bash
                run: |
                    CMAKE_ARGS="-B build -S code"
                    CMAKE_ARGS="$CMAKE_ARGS -DCMAKE_BUILD_TYPE=${{ inputs.build-type }}"
                    CMAKE_ARGS="$CMAKE_ARGS -DCMAKE_CXX_STANDARD=23"
                    CMAKE_ARGS="$CMAKE_ARGS -DCMAKE_CXX_STANDARD_REQUIRED=ON"
                    CMAKE_ARGS="$CMAKE_ARGS -DBUILD_IC10_COMPILER_CORE=ON"
                    CMAKE_ARGS="$CMAKE_ARGS -DBUILD_IC10_COMPILER_EXPORTS_JAVA=ON"
                    if [[ "${{ inputs.run-tests }}" == "true" ]]; then
                      CMAKE_ARGS="$CMAKE_ARGS -DBUILD_IC10_COMPILER_TESTS=ON"
                    fi
                    CMAKE_ARGS="$CMAKE_ARGS -DENABLE_CCACHE=ON"
                    CMAKE_ARGS="$CMAKE_ARGS -DCMAKE_POSITION_INDEPENDENT_CODE=ON"

                    if [[ "${{ inputs.os }}" == "ubuntu-latest" ]]; then
                      CMAKE_ARGS="$CMAKE_ARGS -G Ninja"
                      CMAKE_ARGS="$CMAKE_ARGS -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld"
                    fi

                    echo "CMake args: $CMAKE_ARGS"
                    cmake $CMAKE_ARGS

            -   name: Build | 编译
                shell: bash
                run: |
                    BUILD_TARGETS="ic10_compiler_java common_java"
                    if [[ "${{ inputs.run-tests }}" == "true" ]]; then
                      BUILD_TARGETS="$BUILD_TARGETS IC10_Compiler_Tests"
                    fi
                    cmake --build build --config ${{ inputs.build-type }} --parallel 4 --target $BUILD_TARGETS

            -   name: (Linux) Show ccache/sccache stats | 显示缓存统计
                if: inputs.os == 'ubuntu-latest'
                shell: bash
                run: ccache --show-stats

            -   name: (Windows) Show sccache stats | 显示缓存统计
                if: inputs.os == 'windows-latest'
                shell: pwsh
                run: |
                    if (Get-Command sccache -ErrorAction SilentlyContinue) {
                        sccache --show-stats
                    } elseif (Get-Command ccache -ErrorAction SilentlyContinue) {
                        ccache --show-stats
                    } else {
                        Write-Host "No cache tool available"
                    }

            -   name: Run C++ tests (CTest) | 运行 C++ 测试
                if: inputs.run-tests
                shell: bash
                run: |
                    cd build
                    ctest --output-on-failure --parallel 4 -C ${{ inputs.build-type }}

            -   name: Copy native library to Java package | 复制原生库到 Java 包
                shell: bash
                run: |
                    LIBS_DIR="code/IC10/backend/compiler/publish/java/src/main/resources/native"
                    mkdir -p "$LIBS_DIR"
                    if [[ "${{ inputs.os }}" == "windows-latest" ]]; then
                      # Windows: 多配置生成器
                      find build -name "ic10c_java.dll" 2>/dev/null | head -1 | xargs -I{} cp -f {} "$LIBS_DIR/" 2>/dev/null || \
                      echo "WARNING: ic10c_java.dll not found"
                    else
                      # Linux
                      find build -name "libic10c_java.so" 2>/dev/null | head -1 | xargs -I{} cp -f {} "$LIBS_DIR/" 2>/dev/null || \
                      echo "WARNING: libic10c_java.so not found"
                      if [ -f "$LIBS_DIR/libic10c_java.so" ]; then
                        echo "--- ldd check ---"
                        ldd "$LIBS_DIR/libic10c_java.so" 2>&1 || true
                      fi
                    fi
                    ls -la "$LIBS_DIR/" 2>/dev/null || echo "Directory is empty or missing"

            -   name: Run Gradle tests | 运行 Gradle 测试
                if: inputs.run-tests
                working-directory: code/IC10/backend/compiler/tests/java
                shell: bash
                run: |
                    LIBS_DIR="$(realpath ../../publish/java/src/main/resources/native)"
                    export LD_LIBRARY_PATH="$LIBS_DIR:${LD_LIBRARY_PATH:-}"
                    chmod +x ../../publish/java/gradlew
                    ../../publish/java/gradlew test --no-daemon --stacktrace

            -   name: Set artifact name | 设置产物名称
                id: artifact
                if: inputs.upload-artifact
                shell: bash
                run: |
                    NAME="${{ inputs.artifact-name }}-${{ inputs.os }}"
                    echo "name=$NAME" >> $GITHUB_OUTPUT

            -   name: Upload build artifacts | 上传构建产物
                if: inputs.upload-artifact
                uses: actions/upload-artifact@v6
                with:
                    name: ${{ steps.artifact.outputs.name }}
                    path: |
                        build/exports/java/**
                        build/bin/**
                    retention-days: 7
