name: IC10 Node Bindings Build & Test
run-name: IC10 Node | IC10 Node 绑定

on:
    workflow_call:
        inputs:
            os:
                description: 'Operating system'
                type: string
                required: false
                default: 'ubuntu-latest'
            cmake-version:
                description: 'CMake version'
                type: string
                required: false
                default: '4.2.1'
            node-version:
                description: 'Node.js version'
                type: string
                required: false
                default: '26'
            build-type:
                description: 'Build type'
                type: string
                required: false
                default: 'Release'
            run-tests:
                description: 'Whether to run tests (C++ + Jest)'
                type: boolean
                required: false
                default: true
            upload-artifact:
                description: 'Whether to upload build artifacts'
                type: boolean
                required: false
                default: false
            artifact-name:
                description: 'Artifact name prefix'
                type: string
                required: false
                default: 'ic10-node'
            core-artifact-name:
                description: 'Name of the IC10 core artifact to reuse (empty to build from source)'
                type: string
                required: false
                default: ''
        outputs:
            artifact-name:
                description: 'Name of the uploaded artifact'
                value: ${{ jobs.build.outputs.artifact-name }}

jobs:
    build:
        name: build ${{ inputs.os }} | 构建${{ inputs.os }}
        runs-on: ${{ inputs.os }}
        outputs:
            artifact-name: ${{ steps.artifact.outputs.name }}

        steps:
            -   name: Checkout source code | 检出源码
                uses: actions/checkout@v6

            -   name: Setup build environment | 设置构建环境
                uses: ./.github/actions/setup-build-env
                with:
                    os: ${{ inputs.os }}
                    cmake-version: ${{ inputs.cmake-version }}
                    node-version: ${{ inputs.node-version }}
                    pnpm-version: '9'
                    cache-key-prefix: ic10-node

            -   name: Install compiler pnpm dependencies | 安装 Compiler pnpm 依赖
                working-directory: code/IC10/backend/compiler
                shell: bash
                run: pnpm i --ignore-workspace

            -   name: Download Node headers via node-gyp | 通过 node-gyp 下载 Node 头文件
                working-directory: code/IC10/backend/compiler
                shell: bash
                run: |
                    pnpm add -D node-gyp --ignore-workspace
                    npx node-gyp install

            -   name: Download core artifact | 下载核心构件
                if: inputs.core-artifact-name != ''
                uses: actions/download-artifact@v6
                with:
                    name: ${{ inputs.core-artifact-name }}
                    path: core-artifact

            -   name: Configure CMake | 配置 CMake
                shell: bash
                run: |
                    CMAKE_ARGS="-B build -S code"
                    CMAKE_ARGS="$CMAKE_ARGS -DCMAKE_BUILD_TYPE=${{ inputs.build-type }}"
                    CMAKE_ARGS="$CMAKE_ARGS -DCMAKE_CXX_STANDARD=23"
                    CMAKE_ARGS="$CMAKE_ARGS -DCMAKE_CXX_STANDARD_REQUIRED=ON"
                    CMAKE_ARGS="$CMAKE_ARGS -DBUILD_IC10_COMPILER_CORE=ON"
                    CMAKE_ARGS="$CMAKE_ARGS -DBUILD_IC10_COMPILER_EXPORTS_NODE=ON"
                    if [[ "${{ inputs.run-tests }}" == "true" ]]; then
                      CMAKE_ARGS="$CMAKE_ARGS -DBUILD_IC10_COMPILER_TESTS=ON"
                    fi
                    CMAKE_ARGS="$CMAKE_ARGS -DENABLE_CCACHE=ON"
                    CMAKE_ARGS="$CMAKE_ARGS -DCMAKE_POSITION_INDEPENDENT_CODE=ON"
                    CMAKE_ARGS="$CMAKE_ARGS -DNODE_ADDON_API_DIR=$GITHUB_WORKSPACE/code/IC10/backend/compiler/node_modules/node-addon-api"

                    if [[ "${{ inputs.os }}" == "ubuntu-latest" ]]; then
                      CMAKE_ARGS="$CMAKE_ARGS -G Ninja"
                      CMAKE_ARGS="$CMAKE_ARGS -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld"
                    fi

                    echo "CMake args: $CMAKE_ARGS"
                    cmake $CMAKE_ARGS

            -   name: Build | 编译
                shell: bash
                run: |
                    BUILD_TARGETS="ic10_compiler_node common_node"
                    if [[ "${{ inputs.run-tests }}" == "true" ]]; then
                      BUILD_TARGETS="$BUILD_TARGETS IC10_Compiler_Tests"
                    fi
                    cmake --build build --config ${{ inputs.build-type }} --parallel 4 --target $BUILD_TARGETS

            -   name: (Linux) Show ccache/sccache stats | 显示缓存统计
                if: inputs.os == 'ubuntu-latest'
                shell: bash
                run: ccache --show-stats

            -   name: (Windows) Show sccache stats | 显示缓存统计
                if: inputs.os == 'windows-latest'
                shell: pwsh
                run: |
                    if (Get-Command sccache -ErrorAction SilentlyContinue) {
                        sccache --show-stats
                    } elseif (Get-Command ccache -ErrorAction SilentlyContinue) {
                        ccache --show-stats
                    } else {
                        Write-Host "No cache tool available"
                    }

            -   name: Run C++ tests (CTest) | 运行 C++ 测试
                if: inputs.run-tests
                shell: bash
                run: |
                    cd build
                    ctest --output-on-failure --parallel 4 -C ${{ inputs.build-type }}

            -   name: Run Compiler Node.js tests (Jest) | 运行 Compiler Node.js 测试
                if: inputs.run-tests
                working-directory: code/IC10/backend/compiler
                shell: bash
                run: |
                    # 仓库根目录（从 working-directory 往上 4 层：code/IC10/backend/compiler）
                    REPO_ROOT="$(cd ../../../../.. && pwd)"
                    BUILD_DIR="$REPO_ROOT/build"

                    mkdir -p publish/node/src

                    echo "--- Listing .node files under $BUILD_DIR ---"
                    find "$BUILD_DIR" -name "*.node" 2>/dev/null || true
                    echo "--- End listing ---"

                    # 查找并复制 compiler 的 .node 文件
                    NODE_FILE="$(find "$BUILD_DIR" -name "ic10c-node.node" 2>/dev/null | head -1)"
                    if [ -n "$NODE_FILE" ]; then
                      cp -f "$NODE_FILE" publish/node/src/
                      echo "Copied ic10c-node.node from: $NODE_FILE"
                      ls -la publish/node/src/
                    else
                      echo "ERROR: ic10c-node.node not found under $BUILD_DIR"
                      echo "Listing build tree (top 3 levels):"
                      find "$BUILD_DIR" -maxdepth 3 -type d 2>/dev/null | head -50 || true
                      exit 1
                    fi

                    pnpm test --ignore-workspace

            -   name: Set artifact name | 设置产物名称
                id: artifact
                if: inputs.upload-artifact
                shell: bash
                run: |
                    NAME="${{ inputs.artifact-name }}-${{ inputs.os }}"
                    echo "name=$NAME" >> $GITHUB_OUTPUT

            -   name: Upload build artifacts | 上传构建产物
                if: inputs.upload-artifact
                uses: actions/upload-artifact@v6
                with:
                    name: ${{ steps.artifact.outputs.name }}
                    path: |
                        build/exports/node/**
                        build/bin/**
                    retention-days: 7

