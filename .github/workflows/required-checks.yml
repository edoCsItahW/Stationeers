name: Required Checks Aggregator
run-name: Verify All Required Jobs | 验证所有必需的作业

on:
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]
    
    workflow_dispatch:

jobs:
    verify:
        name: Verify All Required Jobs
        runs-on: ubuntu-latest
        steps:
            -   name: Check status of all required jobs
                uses: actions/github-script@v7
                with:
                    script: |
                        // 1. 定义你认为必须全部通过（或被跳过）的 Job 完整名称
                        const requiredJobs = [
                            'CI / (linux) ic10-core | IC10 核心',       // 对应 ci.yml 中的 ic10-core-linux
                            'CI / (windows) ic10-core | IC10 核心',     // 对应 ci.yml 中的 ic10-core-windows
                            'CI / (linux) ic10-node | IC10 Node 绑定', // 对应 ci.yml 中的 ic10-node-linux
                            'CI / (windows) ic10-node | IC10 Node 绑定', // 对应 ci.yml 中的 ic10-node-windows
                            'CI / static analysis | 静态分析'           // 对应 ci.yml 中的 static-analysis
                        ];

                        // 2. 获取当前 PR 的 Head Commit SHA
                        const sha = context.payload.pull_request.head.sha;
                        const owner = context.repo.owner;
                        const repo = context.repo.repo;

                        console.log(`Checking commit: ${sha}`);

                        // 3. 调用 GitHub API 获取该 commit 关联的所有检查运行状态
                        const { data: checkRuns } = await github.rest.checks.listForRef({
                            owner,
                            repo,
                            ref: sha,
                            filter: 'latest'  // 获取最新一次运行结果
                        });

                        const statuses = checkRuns.check_runs;
                        let hasFailure = false;

                        // 4. 遍历你定义的必须检查项
                        for (const jobName of requiredJobs) {
                            // 在 API 返回的检查列表中查找匹配的 Job
                            const found = statuses.find(r => r.name === jobName);

                            if (found) {
                                const conclusion = found.conclusion;
                                console.log(`✅ Found job: "${jobName}" -> Status: ${conclusion}`);

                                // 只有明确失败或超时才算阻断，跳过(skipped)和中性(neutral)都算通过
                                if (conclusion === 'failure' || conclusion === 'timed_out' || conclusion === 'cancelled') {
                                    core.setFailed(`❌ Required job "${jobName}" failed with status: ${conclusion}`);
                                    hasFailure = true;
                                }
                            } else {
                                // 5. 核心逻辑：如果没找到，说明该 Job 因为 if 条件不满足而被跳过了
                                // 在你的场景下，被跳过是允许的，所以我们视为通过（绿色）
                                console.log(`⏩ Job "${jobName}" not found in this commit (likely conditionally skipped). Allowed.`);
                            }
                        }

                        if (!hasFailure) {
                            console.log('✅ All required checks passed or were skipped. Merge allowed.');
                        }