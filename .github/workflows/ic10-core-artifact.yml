name: IC10 Core Artifact Build
run-name: IC10 Core Artifact | IC10 核心构件

on:
    workflow_call:
        inputs:
            os:
                description: 'Operating system'
                type: string
                required: false
                default: 'ubuntu-latest'
            cmake-version:
                description: 'CMake version'
                type: string
                required: false
                default: '4.2.1'
            build-type:
                description: 'Build type'
                type: string
                required: false
                default: 'Release'
            run-tests:
                description: 'Whether to run tests'
                type: boolean
                required: false
                default: true
            upload-artifact:
                description: 'Whether to upload build artifacts'
                type: boolean
                required: false
                default: true
            build-compiler:
                description: 'Whether to build the IC10_Compiler_CLI executable'
                type: boolean
                required: false
                default: false
            artifact-name:
                description: 'Artifact name prefix'
                type: string
                required: false
                default: 'ic10-core'
        outputs:
            artifact-name:
                description: 'Name of the uploaded artifact'
                value: ${{ jobs.build.outputs.artifact-name }}

jobs:
    build:
        name: build ${{ inputs.os }} | 构建${{ inputs.os }}
        runs-on: ${{ inputs.os }}
        outputs:
            artifact-name: ${{ steps.artifact.outputs.name }}

        steps:
            -   name: Checkout source code | 检出源码
                uses: actions/checkout@v6

            -   name: Setup build environment | 设置构建环境
                uses: ./.github/actions/setup-build-env
                with:
                    os: ${{ inputs.os }}
                    cmake-version: ${{ inputs.cmake-version }}
                    cache-key-prefix: ic10-core

            -   name: Configure CMake | 配置 CMake
                shell: bash
                run: |
                    CMAKE_ARGS="-B build -S code"
                    CMAKE_ARGS="$CMAKE_ARGS -DCMAKE_BUILD_TYPE=${{ inputs.build-type }}"
                    CMAKE_ARGS="$CMAKE_ARGS -DCMAKE_CXX_STANDARD=23"
                    CMAKE_ARGS="$CMAKE_ARGS -DCMAKE_CXX_STANDARD_REQUIRED=ON"
                    CMAKE_ARGS="$CMAKE_ARGS -DBUILD_IC10_COMPILER_CORE=ON"
                    if [[ "${{ inputs.run-tests }}" == "true" ]]; then
                      CMAKE_ARGS="$CMAKE_ARGS -DBUILD_IC10_COMPILER_TESTS=ON"
                    fi
                    CMAKE_ARGS="$CMAKE_ARGS -DENABLE_CCACHE=ON"
                    CMAKE_ARGS="$CMAKE_ARGS -DCMAKE_POSITION_INDEPENDENT_CODE=ON"

                    if [[ "${{ inputs.os }}" == "ubuntu-latest" ]]; then
                      CMAKE_ARGS="$CMAKE_ARGS -G Ninja"
                      CMAKE_ARGS="$CMAKE_ARGS -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld"
                    fi

                    echo "CMake args: $CMAKE_ARGS"
                    cmake $CMAKE_ARGS

            -   name: Build core libraries | 编译核心库
                shell: bash
                run: |
                    BUILD_TARGETS="common_core ic10_compiler_core"
                    if [[ "${{ inputs.run-tests }}" == "true" ]]; then
                      BUILD_TARGETS="$BUILD_TARGETS IC10_Compiler_Tests"
                    fi
                    if [[ "${{ inputs.build-compiler }}" == "true" ]]; then
                      BUILD_TARGETS="$BUILD_TARGETS IC10_Compiler_CLI"
                    fi
                    if [[ "${{ inputs.os }}" == "ubuntu-latest" ]]; then
                      PARALLEL=2
                    else
                      PARALLEL=4
                    fi
                    cmake --build build --config ${{ inputs.build-type }} --parallel $PARALLEL --target $BUILD_TARGETS

            -   name: (Linux) Show ccache/sccache stats | 显示缓存统计
                if: inputs.os == 'ubuntu-latest'
                shell: bash
                run: ccache --show-stats

            -   name: (Windows) Show sccache stats | 显示缓存统计
                if: inputs.os == 'windows-latest'
                shell: pwsh
                run: |
                    if (Get-Command sccache -ErrorAction SilentlyContinue) {
                        sccache --show-stats
                    } elseif (Get-Command ccache -ErrorAction SilentlyContinue) {
                        ccache --show-stats
                    } else {
                        Write-Host "No cache tool available"
                    }

            -   name: Run CTest tests | 运行 CTest 测试
                if: inputs.run-tests
                shell: bash
                run: |
                    cd build
                    ctest --output-on-failure --parallel 4 -C ${{ inputs.build-type }}

            -   name: Prepare artifact directory | 准备构件目录
                shell: bash
                run: |
                    mkdir -p artifacts/lib/common/${{ inputs.build-type }}
                    mkdir -p artifacts/lib/core/${{ inputs.build-type }}
                    mkdir -p artifacts/include/common
                    mkdir -p artifacts/include/core
                    if [[ "${{ inputs.build-compiler }}" == "true" ]]; then
                      mkdir -p artifacts/bin
                    fi

            -   name: Copy libraries | 复制库文件
                shell: bash
                run: |
                    # 收集所有库文件到统一目录
                    LIB_DIR="artifacts/lib"
                    mkdir -p "$LIB_DIR"
                    if [[ "${{ inputs.os }}" == "windows-latest" ]]; then
                      # Windows: 多配置生成器，库在 build-type 子目录
                      find build -name "common_core.lib" -o -name "ic10_compiler_core.lib" 2>/dev/null | while read -r f; do
                        cp -f "$f" "$LIB_DIR/" 2>/dev/null && echo "Copied: $f"
                      done
                      ls -la "$LIB_DIR/" 2>/dev/null || echo "No libs found"
                    else
                      # Linux: 单配置生成器
                      find build -name "libcommon_core.a" -o -name "libic10_compiler_core.a" 2>/dev/null | while read -r f; do
                        cp -f "$f" "$LIB_DIR/" 2>/dev/null && echo "Copied: $f"
                      done
                      ls -la "$LIB_DIR/" 2>/dev/null || echo "No libs found"
                    fi

            -   name: Copy compiler executable | 复制编译器可执行文件
                if: inputs.build-compiler
                shell: bash
                run: |
                    if [[ "${{ inputs.os }}" == "windows-latest" ]]; then
                      # Windows: 查找 .exe 文件
                      find build -name "ic10c.exe" 2>/dev/null | head -1 | xargs -I{} cp -f {} artifacts/bin/ 2>/dev/null || \
                      echo "ic10c.exe not found"
                    else
                      # Linux: 可执行文件无扩展名
                      find build -name "ic10c" -type f 2>/dev/null | head -1 | xargs -I{} cp -f {} artifacts/bin/ 2>/dev/null || \
                      echo "ic10c not found"
                    fi
                    ls -la artifacts/bin/ || true

            -   name: Copy headers | 复制头文件
                shell: bash
                run: |
                    cp -r code/common/cpp/core/include/. artifacts/include/common/
                    cp -r code/IC10/backend/compiler/core/include/. artifacts/include/core/

            -   name: Set artifact name | 设置产物名称
                id: artifact
                if: inputs.upload-artifact
                shell: bash
                run: |
                    NAME="${{ inputs.artifact-name }}-${{ inputs.os }}-${{ inputs.build-type }}"
                    echo "name=$NAME" >> $GITHUB_OUTPUT

            -   name: Upload build artifacts | 上传构建产物
                if: inputs.upload-artifact
                uses: actions/upload-artifact@v6
                with:
                    name: ${{ steps.artifact.outputs.name }}
                    path: |
                        artifacts/**
                    retention-days: 7