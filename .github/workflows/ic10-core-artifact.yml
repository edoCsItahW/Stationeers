name: IC10 Core Artifact Build
run-name: IC10 Core Artifact | IC10 核心构件

on:
    workflow_call:
        inputs:
            os:
                description: 'Operating system'
                type: string
                required: false
                default: 'ubuntu-latest'
            cmake-version:
                description: 'CMake version'
                type: string
                required: false
                default: '4.2.1'
            build-type:
                description: 'Build type'
                type: string
                required: false
                default: 'Release'
            run-tests:
                description: 'Whether to run tests'
                type: boolean
                required: false
                default: true
            upload-artifact:
                description: 'Whether to upload build artifacts'
                type: boolean
                required: false
                default: true
            build-compiler:
                description: 'Whether to build the IC10_Compiler executable'
                type: boolean
                required: false
                default: false
            artifact-name:
                description: 'Artifact name prefix'
                type: string
                required: false
                default: 'ic10-core'
        outputs:
            artifact-name:
                description: 'Name of the uploaded artifact'
                value: ${{ jobs.build.outputs.artifact-name }}

jobs:
    build:
        name: build ${{ inputs.os }} | 构建${{ inputs.os }}
        runs-on: ${{ inputs.os }}
        outputs:
            artifact-name: ${{ steps.artifact.outputs.name }}

        steps:
            -   name: Checkout source code | 检出源码
                uses: actions/checkout@v6

            -   name: Setup build environment | 设置构建环境
                uses: ./.github/actions/setup-build-env
                with:
                    os: ${{ inputs.os }}
                    cmake-version: ${{ inputs.cmake-version }}
                    cache-key-prefix: ic10-core

            -   name: Configure CMake | 配置 CMake
                shell: bash
                run: |
                    CMAKE_ARGS="-B build -S code/backend/compiler"
                    CMAKE_ARGS="$CMAKE_ARGS -DCMAKE_BUILD_TYPE=${{ inputs.build-type }}"
                    CMAKE_ARGS="$CMAKE_ARGS -DCMAKE_CXX_STANDARD=23"
                    CMAKE_ARGS="$CMAKE_ARGS -DCMAKE_CXX_STANDARD_REQUIRED=ON"
                    CMAKE_ARGS="$CMAKE_ARGS -DBUILD_IC10=ON"
                    CMAKE_ARGS="$CMAKE_ARGS -DBUILD_STATIONSCRIPT=OFF"
                    CMAKE_ARGS="$CMAKE_ARGS -DBUILD_NODE_BINDINGS=OFF"
                    CMAKE_ARGS="$CMAKE_ARGS -DBUILD_PYTHON_BINDINGS=OFF"
                    CMAKE_ARGS="$CMAKE_ARGS -DBUILD_TESTS=${{ inputs.run-tests && 'ON' || 'OFF' }}"
                    CMAKE_ARGS="$CMAKE_ARGS -DENABLE_CCACHE=ON"
                    CMAKE_ARGS="$CMAKE_ARGS -DCMAKE_POSITION_INDEPENDENT_CODE=ON"

                    if [[ "${{ inputs.os }}" == "ubuntu-latest" ]]; then
                      CMAKE_ARGS="$CMAKE_ARGS -G Ninja"
                      CMAKE_ARGS="$CMAKE_ARGS -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld"
                    fi

                    echo "CMake args: $CMAKE_ARGS"
                    cmake $CMAKE_ARGS

            -   name: Build core libraries | 编译核心库
                shell: bash
                run: |
                    BUILD_TARGETS="common ic10_lib"
                    if [[ "${{ inputs.run-tests }}" == "true" ]]; then
                      BUILD_TARGETS="$BUILD_TARGETS ic10_tests"
                    fi
                    if [[ "${{ inputs.build-compiler }}" == "true" ]]; then
                      BUILD_TARGETS="$BUILD_TARGETS IC10_Compiler"
                    fi
                    if [[ "${{ inputs.os }}" == "ubuntu-latest" ]]; then
                      PARALLEL=2
                    else
                      PARALLEL=4
                    fi
                    cmake --build build --config ${{ inputs.build-type }} --parallel $PARALLEL --target $BUILD_TARGETS

            -   name: (Linux) Show ccache/sccache stats | 显示缓存统计
                if: inputs.os == 'ubuntu-latest'
                shell: bash
                run: ccache --show-stats

            -   name: (Windows) Show sccache stats | 显示缓存统计
                if: inputs.os == 'windows-latest'
                shell: pwsh
                run: |
                    if (Get-Command sccache -ErrorAction SilentlyContinue) {
                        sccache --show-stats
                    } elseif (Get-Command ccache -ErrorAction SilentlyContinue) {
                        ccache --show-stats
                    } else {
                        Write-Host "No cache tool available"
                    }

            -   name: Run CTest tests | 运行 CTest 测试
                if: inputs.run-tests
                shell: bash
                run: |
                    cd build
                    ctest --output-on-failure --parallel 4 -C ${{ inputs.build-type }}

            -   name: Prepare artifact directory | 准备构件目录
                shell: bash
                run: |
                    mkdir -p artifacts/lib/common/${{ inputs.build-type }}
                    mkdir -p artifacts/lib/IC10/${{ inputs.build-type }}
                    mkdir -p artifacts/include/common
                    mkdir -p artifacts/include/IC10
                    if [[ "${{ inputs.build-compiler }}" == "true" ]]; then
                      mkdir -p artifacts/bin
                    fi

            -   name: Copy libraries | 复制库文件
                shell: bash
                run: |
                    if [[ "${{ inputs.os }}" == "windows-latest" ]]; then
                      cp -f build/common/${{ inputs.build-type }}/common.lib artifacts/lib/common/${{ inputs.build-type }}/ || echo "common.lib not found in expected path"
                      cp -f build/IC10/${{ inputs.build-type }}/ic10_lib.lib artifacts/lib/IC10/${{ inputs.build-type }}/ || echo "ic10_lib.lib not found in expected path"
                    else
                      cp -f build/common/libcommon.a artifacts/lib/common/${{ inputs.build-type }}/ 2>/dev/null || \
                      cp -f build/common/${{ inputs.build-type }}/libcommon.a artifacts/lib/common/${{ inputs.build-type }}/ 2>/dev/null || \
                      echo "libcommon.a not found"

                      cp -f build/IC10/libic10_lib.a artifacts/lib/IC10/${{ inputs.build-type }}/ 2>/dev/null || \
                      cp -f build/IC10/${{ inputs.build-type }}/libic10_lib.a artifacts/lib/IC10/${{ inputs.build-type }}/ 2>/dev/null || \
                      echo "libic10_lib.a not found"
                    fi

            -   name: Copy compiler executable | 复制编译器可执行文件
                if: inputs.build-compiler
                shell: bash
                run: |
                    if [[ "${{ inputs.os }}" == "windows-latest" ]]; then
                      # Windows: 查找 .exe 文件
                      cp -f build/bin/IC10_Compiler.exe artifacts/bin/ 2>/dev/null || \
                      cp -f build/bin/${{ inputs.build-type }}/IC10_Compiler.exe artifacts/bin/ 2>/dev/null || \
                      echo "IC10_Compiler.exe not found"
                    else
                      # Linux: 可执行文件无扩展名
                      cp -f build/bin/IC10_Compiler artifacts/bin/ 2>/dev/null || \
                      echo "IC10_Compiler not found"
                    fi
                    ls -la artifacts/bin/ || true

            -   name: Copy headers | 复制头文件
                shell: bash
                run: |
                    cp -r code/backend/compiler/common/include/. artifacts/include/common/
                    cp -r code/backend/compiler/IC10/include/. artifacts/include/IC10/

            -   name: Set artifact name | 设置产物名称
                id: artifact
                if: inputs.upload-artifact
                shell: bash
                run: |
                    NAME="${{ inputs.artifact-name }}-${{ inputs.os }}-${{ inputs.build-type }}"
                    echo "name=$NAME" >> $GITHUB_OUTPUT

            -   name: Upload build artifacts | 上传构建产物
                if: inputs.upload-artifact
                uses: actions/upload-artifact@v6
                with:
                    name: ${{ steps.artifact.outputs.name }}
                    path: |
                        artifacts/**
                    retention-days: 7