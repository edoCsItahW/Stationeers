name: CI
run-name: CI | 持续集成
 
on:
    push:
        branches: [ main, develop, test ]
    pull_request:
        branches: [ main, develop, test ]
    workflow_dispatch:
 
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true
 
jobs:
    detect-changes:
        name: detect changes | 检测变更
        runs-on: ubuntu-latest
        outputs:
            ic10-core: ${{ steps.filter.outputs.ic10-core }}
            ic10-node: ${{ steps.filter.outputs.ic10-node }}
            ic10-python: ${{ steps.filter.outputs.ic10-python }}
            stationscript: ${{ steps.filter.outputs.stationscript }}
            shared: ${{ steps.filter.outputs.shared }}
            workflow: ${{ steps.filter.outputs.workflow }}
            is-full-build: ${{ steps.flags.outputs.is-full-build }}
 
        steps:
            -   name: Checkout source code | 检出源码
                uses: actions/checkout@v6
                with:
                    fetch-depth: 0
 
            -   name: Path filter | 路径过滤
                id: filter
                uses: dorny/paths-filter@v4
                with:
                    filters: |
                        shared:
                          - 'code/backend/compiler/CMakeLists.txt'
                          - 'code/backend/compiler/cmake/**'
                          - 'code/backend/compiler/common/**'
                          - 'code/backend/compiler/tests/common/**'
                        ic10-core:
                          - 'code/backend/compiler/IC10/**'
                          - 'code/backend/compiler/tests/ic10/*.cpp'
                          - 'code/backend/compiler/tests/ic10/CMakeLists.txt'
                          - 'code/backend/compiler/tests/grammarTest.ic'
                        ic10-node:
                          - 'code/backend/compiler/exports/IC10/node/**'
                          - 'code/backend/compiler/exports/common/node/**'
                          - 'code/backend/compiler/tests/ic10/node/**'
                          - 'code/backend/compiler/tests/node/**'
                          - 'code/backend/compiler/package.json'
                          - 'code/backend/compiler/pnpm-*.yaml'
                          - 'code/backend/compiler/pnpm-workspace.yaml'
                          - 'code/backend/compiler/jest.config.js'
                          - 'code/backend/compiler/tsconfig.json'
                        ic10-python:
                          - 'code/backend/compiler/exports/IC10/python/**'
                          - 'code/backend/compiler/exports/common/python/**'
                          - 'code/backend/compiler/tests/python/**'
                        stationscript:
                          - 'code/backend/compiler/StationScript/**'
                          - 'code/backend/compiler/tests/station_script/**'
                        workflow:
                          - '.github/workflows/**'
                          - '.github/actions/**'
 
            -   name: Determine build mode | 确定构建模式
                id: flags
                shell: bash
                run: |
                    IS_FULL=false
                    if [[ "${{ github.event_name }}" == "push" && ("${{ github.ref_name }}" == "main" || "${{ github.ref_name }}" == "develop") ]]; then
                      IS_FULL=true
                      echo "Full build: push to ${{ github.ref_name }}"
                    elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
                      IS_FULL=true
                      echo "Full build: workflow dispatch"
                    elif [[ "${{ steps.filter.outputs.shared }}" == "true" || "${{ steps.filter.outputs.workflow }}" == "true" ]]; then
                      IS_FULL=true
                      echo "Full build: shared/workflow files changed"
                    else
                      echo "Incremental build: only changed modules will be built"
                    fi
                    echo "is-full-build=$IS_FULL" >> $GITHUB_OUTPUT
 
            -   name: Summary | 变更摘要
                shell: bash
                run: |
                    echo "### Changed Modules" >> $GITHUB_STEP_SUMMARY
                    echo "- IC10 Core: ${{ steps.filter.outputs.ic10-core }}" >> $GITHUB_STEP_SUMMARY
                    echo "- IC10 Node Bindings: ${{ steps.filter.outputs.ic10-node }}" >> $GITHUB_STEP_SUMMARY
                    echo "- IC10 Python Bindings: ${{ steps.filter.outputs.ic10-python }}" >> $GITHUB_STEP_SUMMARY
                    echo "- StationScript: ${{ steps.filter.outputs.stationscript }}" >> $GITHUB_STEP_SUMMARY
                    echo "- Shared (common/cmake): ${{ steps.filter.outputs.shared }}" >> $GITHUB_STEP_SUMMARY
                    echo "- Workflow/Actions: ${{ steps.filter.outputs.workflow }}" >> $GITHUB_STEP_SUMMARY
                    echo "" >> $GITHUB_STEP_SUMMARY
                    echo "**Full build**: ${{ steps.flags.outputs.is-full-build }}" >> $GITHUB_STEP_SUMMARY
 
    ic10-core-artifact-linux:
        name: (linux) ic10-core-artifact | IC10 核心构件
        needs: detect-changes
        if: needs.detect-changes.outputs.is-full-build == 'true' || needs.detect-changes.outputs.ic10-core == 'true' || needs.detect-changes.outputs.shared == 'true'
        uses: ./.github/workflows/ic10-core-artifact.yml
        with:
            os: ubuntu-latest
            run-tests: true
            upload-artifact: true

    ic10-core-artifact-windows:
        name: (windows) ic10-core-artifact | IC10 核心构件
        needs: detect-changes
        if: needs.detect-changes.outputs.is-full-build == 'true' || needs.detect-changes.outputs.ic10-core == 'true' || needs.detect-changes.outputs.shared == 'true'
        uses: ./.github/workflows/ic10-core-artifact.yml
        with:
            os: windows-latest
            run-tests: true
            upload-artifact: true
 
    ic10-node-linux:
        name: (linux) ic10-node | IC10 Node 绑定 
        needs: [detect-changes, ic10-core-artifact-linux]
        if: needs.detect-changes.outputs.is-full-build == 'true' || needs.detect-changes.outputs.ic10-node == 'true' || needs.detect-changes.outputs.ic10-core == 'true'
        uses: ./.github/workflows/ic10-node.yml
        with:
            os: ubuntu-latest
            run-tests: true
            upload-artifact: false
            core-artifact-name: ${{ needs.ic10-core-artifact-linux.outputs.artifact-name }}
 
    ic10-node-windows:
        name: (windows) ic10-node | IC10 Node 绑定 
        needs: [detect-changes, ic10-core-artifact-windows]
        if: needs.detect-changes.outputs.is-full-build == 'true' || needs.detect-changes.outputs.ic10-node == 'true' || needs.detect-changes.outputs.ic10-core == 'true'
        uses: ./.github/workflows/ic10-node.yml
        with:
            os: windows-latest
            run-tests: true
            upload-artifact: false
            core-artifact-name: ${{ needs.ic10-core-artifact-windows.outputs.artifact-name }}

    ic10-python-linux:
        name: (linux) ic10-python | IC10 Python 绑定
        needs: [detect-changes, ic10-core-artifact-linux]
        if: needs.detect-changes.outputs.is-full-build == 'true' || needs.detect-changes.outputs.ic10-python == 'true' || needs.detect-changes.outputs.ic10-core == 'true'
        uses: ./.github/workflows/ic10-python.yml
        with:
            os: ubuntu-latest
            run-tests: true
            upload-artifact: false
            core-artifact-name: ${{ needs.ic10-core-artifact-linux.outputs.artifact-name }}

    ic10-python-windows:
        name: (windows) ic10-python | IC10 Python 绑定
        needs: [detect-changes, ic10-core-artifact-windows]
        if: needs.detect-changes.outputs.is-full-build == 'true' || needs.detect-changes.outputs.ic10-python == 'true' || needs.detect-changes.outputs.ic10-core == 'true'
        uses: ./.github/workflows/ic10-python.yml
        with:
            os: windows-latest
            run-tests: true
            upload-artifact: false
            core-artifact-name: ${{ needs.ic10-core-artifact-windows.outputs.artifact-name }}

    static-analysis:
        name: static analysis | 静态分析
        needs: detect-changes
        if: needs.detect-changes.outputs.is-full-build == 'true' || needs.detect-changes.outputs.ic10-core == 'true' || needs.detect-changes.outputs.stationscript == 'true'
        uses: ./.github/workflows/static-analysis.yml
        with:
            os: ubuntu-latest
            run-cppcheck: true
            run-clang-tidy: true
            run-clang-format: true
            analyze-ic10: true
            analyze-stationscript: ${{ needs.detect-changes.outputs.is-full-build == 'true' || needs.detect-changes.outputs.stationscript == 'true' }}
            analyze-common: true
            upload-reports: true

    final-verification:
        name: final verification | 最终验证
        needs:
            - detect-changes
            - ic10-core-artifact-linux
            - ic10-core-artifact-windows
            - ic10-node-linux
            - ic10-node-windows
            - ic10-python-linux
            - ic10-python-windows
            - static-analysis
        if: always()
        runs-on: ubuntu-latest
        steps:
            -   name: Verify all required jobs | 验证所有必需的作业
                shell: bash
                run: |
                    echo "=== Job Results ==="
                    echo "detect-changes:        ${{ needs.detect-changes.result }}"
                    echo "ic10-core-artifact-linux:   ${{ needs.ic10-core-artifact-linux.result }}"
                    echo "ic10-core-artifact-windows: ${{ needs.ic10-core-artifact-windows.result }}"
                    echo "ic10-node-linux:           ${{ needs.ic10-node-linux.result }}"
                    echo "ic10-node-windows:         ${{ needs.ic10-node-windows.result }}"
                    echo "ic10-python-linux:         ${{ needs.ic10-python-linux.result }}"
                    echo "ic10-python-windows:       ${{ needs.ic10-python-windows.result }}"
                    echo "static-analysis:           ${{ needs.static-analysis.result }}"
                    echo ""

                    HAS_FAILURE=false

                    check_job() {
                        local name="$1"
                        local result="$2"
                        if [[ "$result" == "failure" || "$result" == "timed_out" || "$result" == "cancelled" ]]; then
                            echo "::error::Job \"$name\" failed with status: $result"
                            HAS_FAILURE=true
                        else
                            echo "✅ Job \"$name\" -> $result"
                        fi
                    }

                    check_job "detect-changes"             "${{ needs.detect-changes.result }}"
                    check_job "ic10-core-artifact-linux"   "${{ needs.ic10-core-artifact-linux.result }}"
                    check_job "ic10-core-artifact-windows" "${{ needs.ic10-core-artifact-windows.result }}"
                    check_job "ic10-node-linux"            "${{ needs.ic10-node-linux.result }}"
                    check_job "ic10-node-windows"          "${{ needs.ic10-node-windows.result }}"
                    check_job "ic10-python-linux"          "${{ needs.ic10-python-linux.result }}"
                    check_job "ic10-python-windows"        "${{ needs.ic10-python-windows.result }}"
                    check_job "static-analysis"            "${{ needs.static-analysis.result }}"

                    if [[ "$HAS_FAILURE" == "true" ]]; then
                        echo ""
                        echo "::error::One or more required jobs failed"
                        exit 1
                    fi

                    echo ""
                    echo "✅ All required jobs passed or were skipped."
