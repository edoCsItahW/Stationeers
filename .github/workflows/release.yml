name: Release
run-name: Release ${{ github.ref_name }} | 发布 ${{ github.ref_name }}

on:
    push:
        tags:
            # 仅匹配 v 后紧跟数字的标签（如 v1.0.0, v2.3.1-rc.1）
            # 排除 vscode-ic10-language-support-v* 等子项目标签
            - 'v[0-9]*'
    workflow_dispatch:

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    build-ic10-compiler-cli:
        name: "[Auto] Build IC10 Compiler CLI | 构建IC10编译器CLI"
        strategy:
            matrix:
                include:
                    -   os: ubuntu-latest
                        script-dir: /bashShell
                        script-name: buildIC10CompilerCLI.sh
                        artifact-name: ic10c
                    -   os: windows-latest
                        script-dir: /powerShell
                        script-name: BuildIC10CompilerCLI.ps1
                        artifact-name: ic10c.exe
        uses: ./.github/workflows/cpp-workflow.yml
        with:
            os: ${{ strategy.os }}
            script-dir: ${{ strategy.script-dir }}
            script-name: ${{ strategy.script-name }}
            artifact-name: ${{ strategy.artifact-name }}

    build-ic10-compiler-node:
        name: "[Auto] Build IC10 Compiler Node.js Bindings | 构建IC10编译器Node.js绑定"
        strategy:
            matrix:
                include:
                    -   os: ubuntu-latest
                        script-dir: /bashShell
                        script-name: buildIC10CompilerNode.sh
                    -   os: windows-latest
                        script-dir: /powerShell
                        script-name: BuildIC10CompilerNode.ps1
        uses: ./.github/workflows/node-workflow.yml
        with:
            os: ${{ strategy.os }}
            script-dir: ${{ strategy.script-dir }}
            script-name: ${{ strategy.script-name }}
            artifact-name: ic10c-node.node

    build-ic10-compiler-python:
        name: "[Auto] Build IC10 Compiler Python Bindings | 构建IC10编译器Python绑定"
        strategy:
            matrix:
                include:
                    -   os: ubuntu-latest
                        script-dir: /bashShell
                        script-name: buildIC10CompilerPython.sh
                        artifact-name: ic10c-python.os
                    -   os: windows-latest
                        script-dir: /powerShell
                        script-name: BuildIC10CompilerPython.ps1
                        artifact-name: ic10c-python.pyd
        uses: ./.github/workflows/python-workflow.yml
        with:
            os: ${{ strategy.os }}
            script-dir: ${{ strategy.script-dir }}
            script-name: ${{ strategy.script-name }}
            artifact-name: ${{ strategy.artifact-name }}

    build-ic10-compiler-java:
        name: "[Auto] Build IC10 Compiler Java Bindings | 构建IC10编译器Java绑定"
        strategy:
            matrix:
                include:
                    -   os: ubuntu-latest
                        script-dir: /bashShell
                        script-name: buildIC10CompilerJava.sh
                        artifact-name: ic10c-java.os
                    -   os: windows-latest
                        script-dir: /powerShell
                        script-name: BuildIC10CompilerJava.ps1
                        artifact-name: ic10c-java.dll
        uses: ./.github/workflows/java-workflow.yml
        with:
            os: ${{ strategy.os }}
            script-dir: ${{ strategy.script-dir }}
            script-name: ${{ strategy.script-name }}
            artifact-name: ${{ strategy.artifact-name }}

    # 4. 汇总所有产物并发布到 GitHub Release
    upload-release:
        name: "[Auto] Upload release assets | 上传发布产物"
        needs:
            - build-ic10-compiler-cli
            - build-ic10-compiler-node
            - build-ic10-compiler-python
            - build-ic10-compiler-java
        runs-on: ubuntu-latest
        steps:
            -   name: "[Auto] Checkout source code | 检出源码"
                uses: actions/checkout@v7

            -   name: "[Auto] Download all artifacts | 下载所有产物"
                uses: actions/download-artifact@v8.0.0
                with:
                    path: artifacts

            -   name: "[Auto] Organize release assets | 组织发布产物"
                shell: bash
                run: |
                    mkdir -p release-assets/linux release-assets/windows
                    
                    cp -r artifacts/ic10c release-assets/linux
                    cp -r artifacts/ic10c.exe release-assets/windows

                    cp -r artifacts/ic10c-node.node release-assets/linux
                    cp -r artifacts/ic10c-node.node release-assets/windows

                    cp -r artifacts/ic10c-python.os release-assets/linux
                    cp -r artifacts/ic10c-python.pyd release-assets/windows

                    cp -r artifacts/ic10c-java.os release-assets/linux
                    cp -r artifacts/ic10c-java.dll release-assets/windows
                    
            -   name: "[Auto] Determine prerelease status | 确定预发布状态"
                id: prerelease
                shell: bash
                run: |
                    TAG_NAME="${{ github.ref_name }}"
                    IS_PRERELEASE=false
                    if [[ "$TAG_NAME" == *"-rc"* || "$TAG_NAME" == *"-beta"* || "$TAG_NAME" == *"-alpha"* ]]; then
                        IS_PRERELEASE=true
                    fi
                    echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT

            -   name: "[Auto] Create GitHub Release | 创建GitHub Release"
                uses: softprops/action-gh-release@v2
                with:
                    draft: true
                    prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
                    name: ${{ github.ref_name }}
                    body: |
                        # ${{ github.ref_name }}
                        
                        <details>
                            <summary>中文</summary>
                        
                        # 发布版本 vx.x.x
                        **发布日期**: ${{ github.event.pushed_at }}
                        **完整更新日志**: 
                        
                        ---
                        
                        ## 概述
                        
                        ## 🚀 新增功能
                        
                        ## 🐛 问题修复
                        
                        ## 📚 文档更新
                        
                        ## 🔧 版本信息
                        
                        ## 贡献者
                        - **edocsitahw** — 
                        </details>
                        
                        **Release Date**: ${{ github.event.pushed_at }}
                        **Full Changelog**: 
  
                        ---
                        
                        ## Overview
                        
                        ## 🚀 New Features
                        
                        ## 🐛 Bug Fixes
                        
                        ## 📚 Documentation Updates
                        
                        ## 🔧 Version Information
  
                        ## Contributors
                        - **edocsitahw** — 
