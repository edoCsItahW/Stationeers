name: Release
run-name: Release ${{ github.ref_name }} | 发布 ${{ github.ref_name }}

on:
    push:
        tags:
            - 'v*'   # 匹配 v1.0.0, v2.1.3 等

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    # 1. 构建 IC10 核心库和编译器二进制（Linux + Windows）
    build-core-linux:
        name: (linux) ic10-core-artifact | IC10 核心构件
        uses: ./.github/workflows/ic10-core-artifact.yml
        with:
            os: ubuntu-latest
            build-type: Release
            run-tests: false
            upload-artifact: true
            build-compiler: true
            artifact-name: ic10-core

    build-core-windows:
        name: (windows) ic10-core-artifact | IC10 核心构件
        uses: ./.github/workflows/ic10-core-artifact.yml
        with:
            os: windows-latest
            build-type: Release
            run-tests: false
            upload-artifact: true
            build-compiler: true
            artifact-name: ic10-core

    # 2. 构建 Node.js 绑定（Linux + Windows），依赖核心库
    build-node-linux:
        name: (linux) ic10-node | IC10 Node 绑定
        needs: build-core-linux
        uses: ./.github/workflows/ic10-node.yml
        with:
            os: ubuntu-latest
            build-type: Release
            run-tests: false
            upload-artifact: true
            artifact-name: ic10-node
            core-artifact-name: ${{ needs.build-core-linux.outputs.artifact-name }}

    build-node-windows:
        name: (windows) ic10-node | IC10 Node 绑定
        needs: build-core-windows
        uses: ./.github/workflows/ic10-node.yml
        with:
            os: windows-latest
            build-type: Release
            run-tests: false
            upload-artifact: true
            artifact-name: ic10-node
            core-artifact-name: ${{ needs.build-core-windows.outputs.artifact-name }}

    # 3. 构建 Python 绑定（Linux + Windows），依赖核心库
    build-python-linux:
        name: (linux) ic10-python | IC10 Python 绑定
        needs: build-core-linux
        uses: ./.github/workflows/ic10-python.yml
        with:
            os: ubuntu-latest
            build-type: Release
            run-tests: false
            upload-artifact: true
            artifact-name: ic10-python
            core-artifact-name: ${{ needs.build-core-linux.outputs.artifact-name }}

    build-python-windows:
        name: (windows) ic10-python | IC10 Python 绑定
        needs: build-core-windows
        uses: ./.github/workflows/ic10-python.yml
        with:
            os: windows-latest
            build-type: Release
            run-tests: false
            upload-artifact: true
            artifact-name: ic10-python
            core-artifact-name: ${{ needs.build-core-windows.outputs.artifact-name }}

    # 4. 汇总所有产物并发布到 GitHub Release
    upload-release:
        name: upload release | 上传发布产物
        needs:
            - build-core-linux
            - build-core-windows
            - build-node-linux
            - build-node-windows
            - build-python-linux
            - build-python-windows
        runs-on: ubuntu-latest
        permissions:
            contents: write   # 允许创建 Release 和上传附件
        steps:
            -   name: Checkout source code | 检出源码
                uses: actions/checkout@v6

            # 下载所有 artifacts 到各自以 artifact 名称命名的子目录
            -   name: Download all artifacts | 下载所有产物
                uses: actions/download-artifact@v6
                with:
                    path: artifacts

            # 整理产物结构，按平台分类
            -   name: Organize release assets | 整理发布产物
                shell: bash
                run: |
                    echo "=== Artifact structure ==="
                    ls -R artifacts

                    mkdir -p release-assets/linux
                    mkdir -p release-assets/windows

                    # Linux 核心库
                    if [[ -d "artifacts/ic10-core-ubuntu-latest-Release" ]]; then
                        cp -r artifacts/ic10-core-ubuntu-latest-Release release-assets/linux/ic10-core
                    fi

                    # Windows 核心库
                    if [[ -d "artifacts/ic10-core-windows-latest-Release" ]]; then
                        cp -r artifacts/ic10-core-windows-latest-Release release-assets/windows/ic10-core
                    fi

                    # Linux Node 绑定
                    if [[ -d "artifacts/ic10-node-ubuntu-latest" ]]; then
                        cp -r artifacts/ic10-node-ubuntu-latest release-assets/linux/ic10-node
                    fi

                    # Windows Node 绑定
                    if [[ -d "artifacts/ic10-node-windows-latest" ]]; then
                        cp -r artifacts/ic10-node-windows-latest release-assets/windows/ic10-node
                    fi

                    # Linux Python 绑定
                    if [[ -d "artifacts/ic10-python-ubuntu-latest" ]]; then
                        cp -r artifacts/ic10-python-ubuntu-latest release-assets/linux/ic10-python
                    fi

                    # Windows Python 绑定
                    if [[ -d "artifacts/ic10-python-windows-latest" ]]; then
                        cp -r artifacts/ic10-python-windows-latest release-assets/windows/ic10-python
                    fi

                    # 编译器二进制可执行文件
                    # Linux: IC10_Compiler (重命名为 IC10_Compiler-linux)
                    if [[ -f "artifacts/ic10-core-ubuntu-latest-Release/bin/IC10_Compiler" ]]; then
                        cp -f artifacts/ic10-core-ubuntu-latest-Release/bin/IC10_Compiler release-assets/IC10_Compiler-linux
                        echo "Found Linux IC10_Compiler"
                    else
                        echo "::warning::Linux IC10_Compiler not found"
                    fi

                    # Windows: IC10_Compiler.exe (重命名为 IC10_Compiler.exe)
                    if [[ -f "artifacts/ic10-core-windows-latest-Release/bin/IC10_Compiler.exe" ]]; then
                        cp -f artifacts/ic10-core-windows-latest-Release/bin/IC10_Compiler.exe release-assets/IC10_Compiler.exe
                        echo "Found Windows IC10_Compiler.exe"
                    else
                        echo "::warning::Windows IC10_Compiler.exe not found"
                    fi

                    # 创建各平台压缩包
                    cd release-assets
                    zip -r ic10-core-linux.zip linux/ic10-core/
                    zip -r ic10-core-windows.zip windows/ic10-core/
                    zip -r ic10-node-linux.zip linux/ic10-node/
                    zip -r ic10-node-windows.zip windows/ic10-node/
                    zip -r ic10-python-linux.zip linux/ic10-python/
                    zip -r ic10-python-windows.zip windows/ic10-python/

                    echo "=== Final release assets ==="
                    ls -la

            # 根据 tag 名称判断是否为预发布版本
            -   name: Determine prerelease status | 确定预发布状态
                id: prerelease
                shell: bash
                run: |
                    TAG_NAME="${{ github.ref_name }}"
                    IS_PRERELEASE=false
                    if [[ "$TAG_NAME" == *"-rc"* || "$TAG_NAME" == *"-beta"* || "$TAG_NAME" == *"-alpha"* ]]; then
                        IS_PRERELEASE=true
                    fi
                    echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
                    echo "Tag: $TAG_NAME, Prerelease: $IS_PRERELEASE"

            # 上传到 GitHub Release（草稿模式，人工核对后再发布）
            -   name: Upload to Release | 上传到 Release
                uses: softprops/action-gh-release@v2
                with:
                    draft: true
                    prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
                    name: IC10 Compiler ${{ github.ref_name }}
                    body: |
                        ## IC10 Compiler ${{ github.ref_name }}

                        ### 产物列表
                        - **IC10_Compiler-linux** — Linux 编译器二进制可执行文件
                        - **IC10_Compiler.exe** — Windows 编译器二进制可执行文件
                        - **ic10-core-linux.zip** — Linux 核心库 (libcommon.a, libic10_lib.a, 头文件)
                        - **ic10-core-windows.zip** — Windows 核心库 (common.lib, ic10_lib.lib, 头文件)
                        - **ic10-node-linux.zip** — Linux Node.js 绑定 (.node 文件)
                        - **ic10-node-windows.zip** — Windows Node.js 绑定 (.node 文件)
                        - **ic10-python-linux.zip** — Linux Python 绑定 (.so 文件)
                        - **ic10-python-windows.zip** — Windows Python 绑定 (.pyd 文件)

                        ### 安装说明
                        详见项目文档。
                    files: |
                        release-assets/IC10_Compiler-linux
                        release-assets/IC10_Compiler.exe
                        release-assets/ic10-core-linux.zip
                        release-assets/ic10-core-windows.zip
                        release-assets/ic10-node-linux.zip
                        release-assets/ic10-node-windows.zip
                        release-assets/ic10-python-linux.zip
                        release-assets/ic10-python-windows.zip
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            -   name: Summary | 发布摘要
                shell: bash
                run: |
                    echo "### Release ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
                    echo "" >> $GITHUB_STEP_SUMMARY
                    echo "**Draft**: true (请手动核对后发布)" >> $GITHUB_STEP_SUMMARY
                    echo "**Prerelease**: ${{ steps.prerelease.outputs.is_prerelease }}" >> $GITHUB_STEP_SUMMARY
                    echo "" >> $GITHUB_STEP_SUMMARY
                    echo "#### 产物" >> $GITHUB_STEP_SUMMARY
                    echo "- IC10_Compiler-linux (Linux 编译器二进制)" >> $GITHUB_STEP_SUMMARY
                    echo "- IC10_Compiler.exe (Windows 编译器二进制)" >> $GITHUB_STEP_SUMMARY
                    echo "- ic10-core-linux.zip" >> $GITHUB_STEP_SUMMARY
                    echo "- ic10-core-windows.zip" >> $GITHUB_STEP_SUMMARY
                    echo "- ic10-node-linux.zip" >> $GITHUB_STEP_SUMMARY
                    echo "- ic10-node-windows.zip" >> $GITHUB_STEP_SUMMARY
                    echo "- ic10-python-linux.zip" >> $GITHUB_STEP_SUMMARY
                    echo "- ic10-python-windows.zip" >> $GITHUB_STEP_SUMMARY
